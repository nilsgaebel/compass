name: CI

# Runs on pushes and PRs to main. Free within the plan's Actions minutes.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # allow the image push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Test
        run: mvn -B test

      # Image is built on every run (validates the Dockerfile); the push
      # happens only on pushes to main. Tagged :latest so storage stays at one image.
      - name: Build image
        run: docker build -f src/main/docker/Dockerfile.jvm -t ghcr.io/${{ github.repository }}:latest .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository }}:latest
