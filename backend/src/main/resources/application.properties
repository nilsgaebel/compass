# --- HTTP ---
quarkus.http.port=8080

# --- CORS (allow the React dev server to call the API) ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173

# --- External sports API (TheSportsDB free test key '3') ---
# The @RegisterRestClient(configKey = "sports-api") binds to this base URL.
quarkus.rest-client.sports-api.url=https://www.thesportsdb.com/api/v1/json/3
quarkus.rest-client.sports-api.scope=jakarta.inject.Singleton

# --- OpenAPI / Swagger UI (served at /q/swagger-ui in dev) ---
quarkus.smallrye-openapi.info-title=Compass
quarkus.smallrye-openapi.info-version=1.0.0
